[package]
name = "rtconv-esp32c6-harness"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
rtconv-simd = { path = "../..", default-features = false, features = ["auto"] }

[features]
# Adds the deliberate soft-float `DirectConvolver` (`f32`) comparison workload. Off by default:
# the default build must link no soft-float routine (CI guard in `embedded.yml`).
soft-float-baseline = []

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
