name: CI

on:
  push:
    branches: ["main", "release/*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-docs:
    name: Format, Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --lib --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV (Rust 1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.89.0"
      - run: rustc -vV
      - run: cargo check --lib --no-default-features
      - run: cargo check --all-features
      - run: cargo test --no-default-features
      - run: cargo test
      - run: cargo test --all-features

  test-matrix:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
      - run: rustc -vV
      - run: cargo check --lib --no-default-features
      - run: cargo check --all-features
      - run: cargo test --release --no-default-features
      - run: cargo test --release
      - run: cargo test --release --all-features
      - name: FPU-less auto domain on the host (native-q15, full suite incl. doctests)
        run: cargo test --release --features native-q15
      - name: Q1.31 auto domain on the host (native-q31, full suite incl. doctests)
        run: cargo test --release --features native-q31
      - name: Standalone Zero-Allocation RT Suite
        run: cargo test --release --all-features --test no_alloc_rt
