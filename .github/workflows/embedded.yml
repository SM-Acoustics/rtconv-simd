name: Embedded & Cross-Target Compilation

on:
  push:
    branches: ["main", "release/*"]
  pull_request:

permissions:
  contents: read

jobs:
  no-std-targets:
    name: no_std Check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
          - aarch64-unknown-none
          - wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Compile-only no_std check (no flashing)
        run: cargo check --lib --no-default-features --target ${{ matrix.target }}
