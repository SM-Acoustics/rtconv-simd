name: Embedded & Cross-Target Compilation

on:
  push:
    branches: ["main", "release/*"]
  pull_request:

permissions:
  contents: read

jobs:
  no-std-targets:
    name: no_std Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf # Cortex-M4F/M7 (hardware FPU -> f32 auto domain)
          - thumbv6m-none-eabi # Cortex-M0/M0+ (no FPU -> Q1.15 auto domain)
          - riscv32imac-unknown-none-elf # ESP32-C6 (no FPU -> Q1.15 auto domain)
          - riscv32imafc-unknown-none-elf # ESP32-P4 (hardware FPU -> f32 auto domain)
          - aarch64-unknown-none
          - wasm32-unknown-unknown
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Core only (no features, no flashing)
        run: cargo build --release --lib --no-default-features --target ${{ matrix.target }}
      - name: Default features (auto + fixed-point + NUPC)
        run: cargo build --release --lib --target ${{ matrix.target }}
      - name: Fixed-point stack without auto
        run: cargo build --release --lib --no-default-features --features fixed-nonuniform --target ${{ matrix.target }}

  esp32c6-harness:
    name: ESP32-C6 bare-metal harness (compile-only)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          targets: riscv32imac-unknown-none-elf
          components: llvm-tools
      - name: Build harness (no flashing, no hardware access)
        working-directory: hardware/esp32c6
        run: cargo build --release
      # Issue #32: the FPU-less build must not link the f32 auto path, core's decimal-to-float
      # tables or any soft-float routine, and .text + .rodata stays <= the 0.2.0 size (81,196 B).
      # Sizes are written to the job summary.
      - name: FPU-less binary guard (forbidden symbols, soft-float, size budget)
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          bin="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          LLVM_NM="$bin/llvm-nm" LLVM_SIZE="$bin/llvm-size" \
            scripts/check-no-fpu-binary.sh \
            hardware/esp32c6/target/riscv32imac-unknown-none-elf/release/rtconv-esp32c6-harness 81196
      - name: Build opt-in soft-float baseline (compile check only)
        working-directory: hardware/esp32c6
        run: cargo build --release --features soft-float-baseline
