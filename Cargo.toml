[package]
name = "rtconv-simd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
readme = "README.md"
# repository = "https://github.com/SM-Acoustics/rtconv-simd" # Uncomment after SM-Acoustics/rtconv-simd is created
description = "Pure Rust, no_std FIR convolution with SIMD FFT, caller-managed memory, and predictable real-time DSP workloads."
keywords = ["dsp", "convolution", "simd", "audio", "no-std"]
categories = ["multimedia::audio", "no-std", "algorithms"]
exclude = [
    ".github/*",
    ".gitignore",
    ".gitattributes",
    "rustfmt.toml",
    "VALIDATION.md",
    "RT_AUDIT.md",
]

[lib]
name = "rtconv_simd"
path = "src/lib.rs"

[features]
default = []
# Enables runtime CPU feature detection (`Level::new()`) via `fearless_simd/std`.
# Core DSP processing never uses `std` or `alloc`.
std = ["fearless_simd/std"]
# Optional desktop FFT backend using PhastFT (adds `std` only when explicitly enabled).
phastft = ["std", "dep:phastft"]

[dependencies]
fearless_simd = { version = "1.2.0", default-features = false, features = ["force_support_fallback", "libm"] }
fearless_simd_macros = "0.1.0"
microfft = { version = "0.6.0", default-features = false, features = ["size-256"] }
phastft = { version = "0.4.1", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "rtconv_bench"
harness = false

[[bench]]
name = "fft_backends_bench"
harness = false
